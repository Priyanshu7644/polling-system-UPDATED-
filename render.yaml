services:
  # Backend Web Service
  - type: web
    name: polling-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard (MongoDB Atlas connection string)
      - key: JWT_SECRET
        generateValue: true
      - key: BACKEND_URL
        value: "https://polling-backend.onrender.com"
      - key: CLIENT_URL
        value: "https://polling-frontend.onrender.com"
      - key: EMAIL_USER
        sync: false # Set in Render Dashboard
      - key: EMAIL_PASS
        sync: false # Set in Render Dashboard


  # Frontend Static Site
  - type: web
    name: polling-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    envVars:
      - key: NPM_CONFIG_LEGACY_PEER_DEPS
        value: "true"
      - key: VITE_API_URL
        value: "https://polling-backend.onrender.com/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

